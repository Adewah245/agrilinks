<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Agro-Shield</title>

<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/login.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="auth-container">

<div class="auth-left">

<img
id="auth-background"
class="background-image"
src="/static/assets/images/login-image1.jpeg"
alt="Farmer"
>

<div class="overlay"></div>

<div class="left-content">

<h1>Welcome Back</h1>

<p>
            Sign in to continue managing your farm,
            monitor produce, access the marketplace,
            and use AI-powered farming assistance.
</p>

</div>

</div>

<div class="auth-right">

<form id="login-form" method="POST" action="/login">

<h2>Login</h2>

            {{if .Error}}
<p class="message" style="color:red;">{{.Error}}</p>
            {{end}}

<label>Phone Number</label>
<input
type="tel"
id="phone"
name="phone"
placeholder="Enter your phone number"
required
>

<label>Password</label>
<div class="password-wrapper">
<input
type="password"
id="password"
name="password"
placeholder="Enter your password"
required
>
<i
class="fa-solid fa-eye toggle-password"
id="toggle-password"
></i>
</div>

<button type="submit">Sign In</button>

<p><a href="/forgot-password">Forgot password?</a></p>

<p>
                Don't have an account?
<a href="/register">Create one</a>
</p>

</form>

</div>

</div>

<script src="/static/js/login.js"></script>

</body>
</html>
