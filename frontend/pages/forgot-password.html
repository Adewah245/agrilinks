<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Agro-Shield account password securely using your registered phone number.">
    <title>Forgot Password | Agro-Shield</title>

    <link rel="stylesheet" href="/static/css/style.css?v=20260904">
    <link rel="stylesheet" href="/static/css/login.css?v=20260904">
</head>
<body>

<main class="auth-container">

    <!-- =====================================================
         INFORMATION PANEL
    ====================================================== -->
    <section class="auth-left" aria-labelledby="reset-password-title">
        <h1 id="reset-password-title">Reset Password</h1>
        <p>
            Enter the phone number linked to your Agro-Shield account and choose a new password.
        </p>
    </section>

    <!-- =====================================================
         PASSWORD RESET FORM
    ====================================================== -->
    <section class="auth-right">
        <form id="forgot-form" method="POST" action="/forgot-password" novalidate>
            <h2>Forgot Password</h2>

            <!-- Anti-CSRF Token -->
            {{if .CSRFToken}}
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            {{end}}

            <!-- =================================================
                 ERROR MESSAGE
            ================================================== -->
            {{if .Error}}
            <p class="message message-error" role="alert">
                {{.Error}}
            </p>
            {{end}}

            <!-- =================================================
                 SUCCESS MESSAGE
            ================================================== -->
            {{if .Success}}
            <p class="message message-success" role="status">
                {{.Success}}
            </p>
            {{end}}

            <!-- JS Error Container for Client-Side Validation -->
            <p id="js-error-message" class="message message-error" role="alert" style="display: none;"></p>

            <!-- =================================================
                 PHONE NUMBER
            ================================================== -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    id="phone" 
                    type="tel" 
                    name="phone" 
                    value="{{if .Phone}}{{.Phone}}{{end}}"
                    placeholder="e.g. +2348000000000 or 08000000000" 
                    autocomplete="tel" 
                    inputmode="tel" 
                    maxlength="20" 
                    required
                >
            </div>

            <!-- =================================================
                 NEW PASSWORD
            ================================================== -->
            <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="password-input-wrapper">
                    <input 
                        id="new-password" 
                        type="password" 
                        name="new_password" 
                        placeholder="At least 8 characters" 
                        autocomplete="new-password" 
                        minlength="8" 
                        maxlength="128" 
                        required
                    >
                    <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">Show</button>
                </div>
            </div>

            <!-- =================================================
                 CONFIRM PASSWORD
            ================================================== -->
            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <div class="password-input-wrapper">
                    <input 
                        id="confirm-password" 
                        type="password" 
                        name="confirm_password" 
                        placeholder="Confirm your new password" 
                        autocomplete="new-password" 
                        minlength="8" 
                        maxlength="128" 
                        required
                    >
                    <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">Show</button>
                </div>
            </div>

            <!-- =================================================
                 SUBMIT
            ================================================== -->
            <button type="submit" id="submit-btn" class="primary-action">
                Reset Password
            </button>

            <!-- =================================================
                 LOGIN LINK
            ================================================== -->
            <p class="auth-switch">
                Remembered your password? 
                <a href="/login">Back to login</a>
            </p>
        </form>
    </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("forgot-form");
    const newPassword = document.getElementById("new-password");
    const confirmPassword = document.getElementById("confirm-password");
    const jsError = document.getElementById("js-error-message");
    const toggleButtons = document.querySelectorAll(".btn-toggle-password");

    // Toggle password visibility
    toggleButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
            const input = btn.previousElementSibling;
            if (input && input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else if (input) {
                input.type = "password";
                btn.textContent = "Show";
            }
        });
    });

    // Client-side Password Match Check
    form.addEventListener("submit", (e) => {
        jsError.style.display = "none";
        jsError.textContent = "";

        if (newPassword.value !== confirmPassword.value) {
            e.preventDefault();
            jsError.textContent = "Passwords do not match. Please re-enter.";
            jsError.style.display = "block";
            confirmPassword.focus();
            return;
        }

        if (newPassword.value.length < 8) {
            e.preventDefault();
            jsError.textContent = "Password must be at least 8 characters long.";
            jsError.style.display = "block";
            newPassword.focus();
            return;
        }
    });
});
</script>

</body>
</html>
