<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Agro-Shield</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/register.css">
    <link rel="stylesheet" href="/static/css/register-extra.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>


<body>


<main class="auth-container">


<!-- LEFT SIDE -->

<section class="auth-left">

<h1>
Join Agro-Shield
</h1>


<p>
Create your account to manage your farm,
monitor production, receive AI farming
recommendations, connect with buyers,
and improve your agricultural business.
</p>


</section>




<!-- RIGHT SIDE -->

<section class="auth-right">


<div class="auth-form-wrapper">



<img
class="auth-brand"
src="/static/assets/logo/Agro-Shield_logo.png"
alt="Agro-Shield"
>



<form
id="register-form"
action="/register"
method="POST"
enctype="multipart/form-data"
>


<h2>
Create Account
</h2>



<!-- ACCOUNT TYPE -->

<label>
I am a
</label>


<div class="role-select">


<label class="role-option">

<input
type="radio"
name="role"
value="farmer"
checked
>

<span>
🌾 Farmer
</span>

</label>



<label class="role-option">

<input
type="radio"
name="role"
value="buyer"
>

<span>
🛒 Buyer
</span>

</label>


</div>






<!-- FARM TYPE -->

<div class="farm-type-section">


<label>
Type of Farming
</label>


<p class="field-help">
Select all farming activities you do.
</p>



<div class="farm-options">


<label class="farm-option">

<input
type="checkbox"
name="farm_type"
value="crop"
>

<span>
🌱 Crop Farming
</span>

</label>



<label class="farm-option">

<input
type="checkbox"
name="farm_type"
value="livestock"
>

<span>
🐄 Livestock Farming
</span>

</label>



<label class="farm-option">

<input
type="checkbox"
name="farm_type"
value="poultry"
>

<span>
🐓 Poultry Farming
</span>

</label>




<label class="farm-option">

<input
type="checkbox"
name="farm_type"
value="fishery"
>

<span>
🐟 Fish Farming
</span>

</label>




<label class="farm-option">

<input
type="checkbox"
name="farm_type"
value="beekeeping"
>

<span>
🐝 Beekeeping
</span>

</label>



<label class="farm-option">

<input
type="checkbox"
name="farm_type"
value="other"
>

<span>
🌍 Other Farming
</span>

</label>


</div>


</div>







<!-- NAME -->

<div class="row">


<div class="form-group">

<label>
First Name
</label>


<input
name="first-name"
id="first-name"
type="text"
placeholder="First Name"
required
>


</div>



<div class="form-group">

<label>
Last Name
</label>


<input
name="last-name"
id="last-name"
type="text"
placeholder="Last Name"
required
>


</div>


</div>







<!-- EMAIL -->


<div class="form-group">


<label>
Email Address
</label>


<input
name="email"
id="email"
type="email"
placeholder="Enter your email"
required
>


</div>






<!-- PHONE -->


<div class="form-group">


<label>
Phone Number
</label>


<input
name="phone"
id="phone"
type="tel"
placeholder="Enter phone number"
required
>


</div>







<!-- LOCATION -->


<div class="form-group">


<label>
Location (LGA)
</label>


<select
name="location"
required
>


<option value="">
Select your LGA
</option>


<option>
Ado
</option>

<option>
Agatu
</option>

<option>
Apa
</option>

<option>
Gboko
</option>

<option>
Makurdi
</option>

<option>
Otukpo
</option>


<option>
Others
</option>


</select>


</div>








<!-- PASSWORD -->


<div class="form-group">


<label>
Password
</label>



<div class="password-wrapper">


<input
id="password"
name="password"
type="password"
placeholder="Create password"
required
>



<i
class="fa-solid fa-eye toggle-password"
id="toggle-password">
</i>



</div>


</div>






<!-- CONFIRM PASSWORD -->


<div class="form-group">


<label>
Confirm Password
</label>



<div class="password-wrapper">


<input
id="confirm-password"
name="confirm-password"
type="password"
placeholder="Confirm password"
required
>



<i
class="fa-solid fa-eye toggle-password"
id="toggle-confirm-password">
</i>



</div>


</div>







<!-- PROFILE IMAGE -->


<div class="form-group profile-upload">


<label>
Profile Picture
</label>


<input
type="file"
name="profile_picture"
accept="image/*"
required
>


</div>







<button type="submit">

Create Account

</button>





<p class="auth-footer">

Already have an account?

<a href="/login">
Login
</a>

</p>




</form>


</div>


</section>



</main>



<script src="/static/js/register.js"></script>


</body>

</html>
